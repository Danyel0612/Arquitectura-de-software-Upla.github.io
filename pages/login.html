<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UPLA</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=11">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(5,10,25,0.75), rgba(5,10,25,0.9)),
        url('../Imagenes/fondo1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
    }

    .login-wrap {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      background: rgba(13, 31, 60, 0.9);
      padding: 2.5rem;
      border-radius: 18px;
      width: 360px;
      text-align: center;
      border: 1px solid rgba(0,229,255,0.25);
      box-shadow: 0 0 35px rgba(0,229,255,0.25);
      backdrop-filter: blur(15px);
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(0,229,255,0.3);
      background: rgba(255,255,255,0.08);
      color: white;
      box-sizing: border-box;
    }

    .btn-login,
    .btn-register {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-login {
      background: linear-gradient(90deg, #00c6ff, #7f00ff);
      color: white;
    }

    .btn-register {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    #estado {
      margin-top: 12px;
      color: #fca5a5;
    }

    a {
      color: #00e5ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h2>Bienvenido</h2>
      <p>Portafolio - Arquitectura de Software</p>

      <div class="form-group">
        <label>Correo</label>
        <input type="email" id="usuario" placeholder="Ingresa tu correo">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>

      <button class="btn-login" id="btnLogin">Iniciar Sesión</button>
      <button class="btn-register" id="btnRegister">Crear Cuenta</button>

      <div id="estado"></div>

      <p style="margin-top:15px;">
        <a href="../index.html">← Volver al inicio</a>
      </p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://cilnbzovlcarnjkiuylh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pizASaSdNvJwCiZxwCc9KA_PoYoB69a";
    const SESSION_KEY  = "upla-session";

    const estado = document.getElementById("estado");

    // Si ya hay sesión activa, redirigir directamente
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.expires_at && Date.now() / 1000 < s.expires_at) {
          window.location.href = "../index.html";
        }
      }
    } catch {}

    document.getElementById("btnLogin").addEventListener("click", async () => {
      const email    = document.getElementById("usuario").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        estado.textContent = "Completa correo y contraseña.";
        return;
      }

      estado.style.color = "#fca5a5";
      estado.textContent = "Iniciando sesión…";

      try {
        const res = await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method:  "POST",
            headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
            body:    JSON.stringify({ email, password })
          }
        );
        const data = await res.json();

        if (!res.ok) {
          estado.textContent = "Error: " + (data.error_description || data.msg || "Credenciales incorrectas");
          return;
        }

        // Guardar sesión en localStorage con la misma clave que main.js
        localStorage.setItem(SESSION_KEY, JSON.stringify(data));

        estado.style.color = "#86efac";
        estado.textContent = "¡Login correcto! Redirigiendo…";

        setTimeout(() => { window.location.href = "../index.html"; }, 600);

      } catch (err) {
        estado.textContent = "Error de red: " + err.message;
      }
    });

    document.getElementById("btnRegister").addEventListener("click", async () => {
      const email    = document.getElementById("usuario").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        estado.textContent = "Completa correo y contraseña.";
        return;
      }

      estado.style.color = "#fca5a5";
      estado.textContent = "Creando cuenta…";

      try {
        const res = await fetch(
          `${SUPABASE_URL}/auth/v1/signup`,
          {
            method:  "POST",
            headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
            body:    JSON.stringify({ email, password })
          }
        );
        const data = await res.json();

        if (!res.ok) {
          estado.textContent = "Error: " + (data.error_description || data.msg || "Error al crear cuenta");
          return;
        }

        estado.style.color = "#86efac";
        estado.textContent = "Cuenta creada. Revisa tu correo y luego inicia sesión.";

      } catch (err) {
        estado.textContent = "Error de red: " + err.message;
      }
    });
  </script>
</body>
</html>
